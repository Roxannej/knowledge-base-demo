services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kb-demo-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kb-demo-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
